<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - 庭寬的足球小窩</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark-color);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: #1557b0;
            transform: translateY(-2px);
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .help-text {
            font-size: 0.85rem;
            color: #999;
            margin-top: 0.5rem;
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }

        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>⚽ 管理後台</h1>
            <p>庭寬的足球小窩管理系統</p>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                    <div class="help-text">使用管理員帳號登入（由 Render 後端驗證）</div>
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required placeholder="輸入密碼">
                </div>

                <button type="submit" class="login-btn" id="loginBtn">登入</button>
            </form>

            <form id="signupForm" class="hidden">
                <div class="form-group">
                    <label for="signupName">顯示名稱</label>
                    <input type="text" id="signupName" name="signupName" required placeholder="你的名字">
                </div>

                <div class="form-group">
                    <label for="signupEmail">電子郵件</label>
                    <input type="email" id="signupEmail" name="signupEmail" required placeholder="your@email.com">
                    <div class="help-text">建立後可用此帳號登入後台管理內容</div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">密碼</label>
                    <input type="password" id="signupPassword" name="signupPassword" minlength="8" required placeholder="至少 8 碼">
                </div>

                <div class="form-group">
                    <label for="signupPasswordConfirm">確認密碼</label>
                    <input type="password" id="signupPasswordConfirm" name="signupPasswordConfirm" minlength="8" required placeholder="再輸入一次密碼">
                </div>

                <button type="submit" class="login-btn" id="signupBtn">建立帳號</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingText">處理中...</p>
            </div>

            <div class="signup-link" id="loginSwitchLink">
                沒有帳號？<a href="#" onclick="toggleSignup(true)">點這裡註冊</a>
            </div>
            <div class="signup-link hidden" id="signupSwitchLink">
                已有帳號？<a href="#" onclick="toggleSignup(false)">回到登入</a>
            </div>
            <div class="signup-link">
                <a href="index.html">← 回到主頁</a>
            </div>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script src="api-utils.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');

        function showError(message) {
            successDiv.style.display = 'none';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function showSuccess(message) {
            errorDiv.style.display = 'none';
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function clearMessages() {
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
        }

        function setLoadingState(enabled, text) {
            loading.style.display = enabled ? 'block' : 'none';
            if (text) {
                loadingText.textContent = text;
            }
            loginBtn.disabled = enabled;
            signupBtn.disabled = enabled;
        }

        // 登入表單提交
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                clearMessages();
                setLoadingState(true, '正在登入...');

                await loginUser(email, password);
                
                // 登入成功，轉向管理頁面
                window.location.href = 'admin-dashboard.html';
            } catch (error) {
                console.error('登入錯誤:', error);
                showError('登入失敗：' + error.message);
                setLoadingState(false);
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupPasswordConfirm').value;

            if (password !== confirmPassword) {
                showError('兩次密碼不一致');
                return;
            }

            try {
                clearMessages();
                setLoadingState(true, '正在建立帳號...');
                await registerUser(name, email, password);
                showSuccess('註冊成功，正在進入管理頁面...');
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 800);
            } catch (error) {
                console.error('註冊錯誤:', error);
                showError('註冊失敗：' + error.message);
                setLoadingState(false);
            }
        });

        // 檢查是否已登入
        window.addEventListener('load', async () => {
            const user = await getCurrentUser();
            if (user) {
                // 已登入，直接轉向管理頁面
                window.location.href = 'admin-dashboard.html';
            }
        });

        // 註冊切換
        function toggleSignup(showSignup) {
            clearMessages();
            loginForm.classList.toggle('hidden', showSignup);
            signupForm.classList.toggle('hidden', !showSignup);
            document.getElementById('loginSwitchLink').classList.toggle('hidden', showSignup);
            document.getElementById('signupSwitchLink').classList.toggle('hidden', !showSignup);
        }
    </script>
</body>
</html>
