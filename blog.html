<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賽事資訊 - 庭寬的足球小窩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">庭寬的足球小窩</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">關於我</a></li>
                <li><a href="blog.html" class="active">賽事資訊</a></li>
                <li><a href="players.html">球員資料</a></li>
                <li><a href="chat.html">聊天室</a></li>
                <li><a href="admin.html" style="color: var(--accent-color); font-weight: bold;">帳號</a></li>
            </ul>
        </div>
    </nav>

    <!-- 賽事資訊區 -->
    <section class="blog-section">
        <div class="container">
            <h1>賽事資訊</h1>

            <section class="blog-post composer" aria-label="發布新文章">
                <h2>發布新文章</h2>
                <p id="blogComposerHint" class="subtitle" style="text-align: left; margin-bottom: 1rem;">請先登入後台帳號，才能發布文章。</p>
                <form id="blogComposerForm">
                    <div class="form-group">
                        <label for="postTitle">標題</label>
                        <input id="postTitle" type="text" maxlength="120" required placeholder="輸入文章標題">
                    </div>
                    <div class="form-group">
                        <label for="postCategory">分類</label>
                        <input id="postCategory" type="text" maxlength="40" required placeholder="例如：賽事分析、足球知識">
                    </div>
                    <div class="form-group">
                        <label for="postImageUrl">圖片網址（可選）</label>
                        <input id="postImageUrl" type="url" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="postContent">內容</label>
                        <textarea id="postContent" rows="6" required placeholder="分享你的觀點與內容"></textarea>
                    </div>
                    <button id="publishBtn" type="submit" class="submit-btn">發布文章</button>
                </form>
            </section>

            <div id="articlesContainer" class="articles-container">
                <article class="blog-post">
                    <h2>正在載入賽事資訊...</h2>
                </article>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 庭寬的足球小窩. 保留所有權利。</p>
            <div class="social-links">
                <a href="#">Discord</a>
                <a href="#">X</a>
                <a href="#">IG</a>
            </div>
        </div>
    </footer>

    <script src="api-config.js"></script>
    <script src="api-utils.js"></script>
    <script src="script.js"></script>
    <script>
        const composerForm = document.getElementById('blogComposerForm');
        const composerHint = document.getElementById('blogComposerHint');
        const publishBtn = document.getElementById('publishBtn');
        let currentUser = null;

        function formatTime(value) {
            if (!value) return '剛剛';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '剛剛';
            return date.toLocaleString('zh-TW');
        }

        async function loadPublicArticles() {
            const container = document.getElementById('articlesContainer');
            const articles = await getArticles();
            if (!articles.length) {
                container.innerHTML = `
                    <article class="blog-post">
                        <h2>目前還沒有文章</h2>
                        <p>登入帳號後，從文章管理新增內容，就會顯示在這裡。</p>
                    </article>`;
                return;
            }

            container.innerHTML = articles.map(article => `
                <article class="blog-post">
                    <div class="post-meta">
                        <span class="post-category">${article.category || '賽事資訊'}</span>
                        <span>作者：${article.authorName || '站內作者'}</span>
                        <span>發布：${formatTime(article.createdAt)}</span>
                    </div>
                    <h2>${article.title || '未命名文章'}</h2>
                    <p>${article.content || ''}</p>
                    ${article.imageUrl ? `<img class="article-image" src="${article.imageUrl}" alt="${article.title || '賽事資訊'}">` : ''}
                </article>
            `).join('');
        }

        async function initComposer() {
            currentUser = await getCurrentUser();
            if (!currentUser) {
                composerHint.textContent = '你尚未登入，請先到帳號頁登入後再發布。';
                publishBtn.disabled = true;
                return;
            }

            composerHint.textContent = `目前登入：${currentUser.email}`;
            publishBtn.disabled = false;
        }

        composerForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!currentUser) {
                composerHint.textContent = '請先登入後再發布文章。';
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value.trim();
            const imageUrl = document.getElementById('postImageUrl').value.trim();
            const content = document.getElementById('postContent').value.trim();

            try {
                publishBtn.disabled = true;
                publishBtn.textContent = '發布中...';
                await addArticle(title, content, category, imageUrl);
                composerForm.reset();
                composerHint.textContent = '文章已發布成功';
                await loadPublicArticles();
            } catch (error) {
                composerHint.textContent = `發布失敗：${error.message}`;
            } finally {
                publishBtn.disabled = !currentUser;
                publishBtn.textContent = '發布文章';
            }
        });

        initComposer();
        loadPublicArticles();
    </script>
</body>
</html>
