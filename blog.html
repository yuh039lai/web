<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賽事資訊 - 庭寬的足球小窩</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">⚽</span>
                <span class="logo-text">庭寬的足球小窩</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">關於我</a></li>
                <li><a href="blog.html" class="active">賽事資訊</a></li>
                <li><a href="chat.html">聊天室</a></li>
                <li><a href="admin.html" style="color: var(--accent-color); font-weight: bold;">帳號</a></li>
            </ul>
        </div>
    </nav>

    <!-- 賽事資訊區 -->
    <section class="blog-section">
        <div class="container">
            <h1>賽事資訊</h1>

            <div id="articlesContainer" class="articles-container">
                <article class="blog-post">
                    <h2>正在載入賽事資訊...</h2>
                </article>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 庭寬的足球小窩. 保留所有權利。</p>
            <div class="social-links">
                <a href="#">Discord</a>
                <a href="#">X</a>
                <a href="#">IG</a>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK (compat, for global firebase.* API) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script src="firebase-config.js"></script>
    <script src="firebase-utils.js"></script>
    <script src="script.js"></script>
    <script>
        async function loadPublicArticles() {
            const container = document.getElementById('articlesContainer');
            const articles = await getArticles();
            if (!articles.length) {
                container.innerHTML = `
                    <article class="blog-post">
                        <h2>目前還沒有文章</h2>
                        <p>登入帳號後，從文章管理新增內容，就會顯示在這裡。</p>
                    </article>`;
                return;
            }

            container.innerHTML = articles.map(article => `
                <article class="blog-post">
                    <div class="post-meta">
                        <span class="post-category">${article.category || '賽事資訊'}</span>
                    </div>
                    <h2>${article.title || '未命名文章'}</h2>
                    <p>${article.content || ''}</p>
                    ${article.imageUrl ? `<img class="article-image" src="${article.imageUrl}" alt="${article.title || '賽事資訊'}">` : ''}
                </article>
            `).join('');
        }

        loadPublicArticles();
    </script>
</body>
</html>
