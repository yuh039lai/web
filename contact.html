        <div class="container">
            <div class="logo">
                <span class="logo-icon">⚽</span>

            </div>
            <ul class="nav-links">
                <li><a href="index.html">首頁</a></li>

    <!-- 聯絡我內容 -->
    <section class="contact-section">
        <div class="container">
            <h1>聯絡我</h1>
            <p class="subtitle">想一起聊足球？可以透過以下方式找到我！</p>

            <div class="contact-content">
                <div class="contact-info">
                    <h2>我的社群帳號</h2>
                    
                    <div class="info-item">
                        <div class="info-icon">💬</div>
                        <div class="info-content">
                            <h3>Discord ID</h3>
                            <p>待填寫你的 Discord ID</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-icon">📸</div>
                        <div class="info-content">
                            <h3>Instagram ID</h3>
                            <p>待填寫你的 IG ID</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
